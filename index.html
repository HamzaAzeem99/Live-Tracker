<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Group Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    overflow: hidden;
    background: #f1f5f9;
  }
  h1 {
    background: #0f172a;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 1.4rem;
  }
  #map { width: 100%; height: calc(100vh - 56px); }
  .control-panel {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: rgba(255,255,255,0.97); backdrop-filter: blur(12px);
    padding: 16px; border-radius: 16px; box-shadow: 0 4px 30px rgba(0,0,0,0.15);
    width: 90%; max-width: 380px; text-align: center;
  }
  .btn {
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 1.05rem;
    cursor: pointer;
    width: 100%;
    margin: 8px 0;
  }
  .btn-primary { background: #2563eb; color: white; }
  .btn-success { background: #10b981; color: white; }
  .btn-copy { background: #475569; color: white; }
  .btn-retry { background: #ef4444; color: white; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { margin: 0; flex: 1; }
  #status { margin: 12px 0 8px 0; font-size: 1rem; font-weight: 500; color: #334155; }
</style>
</head>
<body>

<h1>Live Group Tracker</h1>
<div id="map"></div>

<div class="control-panel">
  <button id="startBtn" class="btn btn-primary" onclick="startTracking()">
    Start Live Sharing
  </button>
  
  <div id="shareOptions" class="btn-row" style="display: none;">
    <button class="btn btn-success" onclick="shareWhatsApp()">📲 WhatsApp</button>
    <button class="btn btn-copy" onclick="copyLink()">📋 Copy Link</button>
  </div>

  <button id="retryBtn" class="btn btn-retry" style="display: none;" onclick="retryGPS()">
    🔄 Retry GPS
  </button>

  <p id="status">Ready</p>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBlmbq7wB_IfKAUVgLoh6rK9F1IQPqG1Y",
  authDomain: "live-map-40eee.firebaseapp.com",
  databaseURL: "https://live-map-40eee-default-rtdb.firebaseio.com",
  projectId: "live-map-40eee",
  storageBucket: "live-map-40eee.firebasestorage.app",
  messagingSenderId: "886609126465",
  appId: "1:886609126465:web:099c5d8524803ae4be12c0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, watchId = null, sessionId = null, myRef = null;
const userId = localStorage.getItem("tracker_userId") || "user_" + Math.random().toString(36).substr(2, 9);
localStorage.setItem("tracker_userId", userId);

let markers = {};
let circles = {};

// Initialize Map
map = L.map('map', { zoomControl: false }).setView([30.3753, 69.3451], 5);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

function getRoomFromURL() {
  return new URLSearchParams(window.location.search).get("room");
}

window.startTracking = function() {
  if (!sessionId) {
    sessionId = Math.floor(100000 + Math.random() * 900000).toString();
    history.replaceState({}, '', `?room=${sessionId}`);
  }

  document.getElementById("startBtn").style.display = "none";
  document.getElementById("shareOptions").style.display = "flex";
  document.getElementById("status").innerText = `Room: ${sessionId} | Connecting GPS...`;

  startLiveSession(sessionId);
};

function startLiveSession(sid) {
  sessionId = sid;
  myRef = db.ref(`sessions/${sessionId}/${userId}`);
  myRef.onDisconnect().remove();

  document.getElementById("retryBtn").style.display = "none";

  if (navigator.geolocation) {
    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        document.getElementById("status").innerText = `✅ Live Tracking Active`;
        document.getElementById("retryBtn").style.display = "none";

        myRef.set({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy || 30,
          time: Date.now()
        });
      },
      (err) => {
        console.error(err);
        let msg = "❌ GPS Error";
        if (err.code === 1) msg = "❌ Permission Denied - Allow Location";
        else if (err.code === 2) msg = "❌ Location Unavailable";
        else if (err.code === 3) msg = "❌ GPS Timeout";

        document.getElementById("status").innerText = msg;
        document.getElementById("retryBtn").style.display = "block";
      },
      { 
        enableHighAccuracy: true, 
        maximumAge: 5000, 
        timeout: 20000 
      }
    );
  } else {
    document.getElementById("status").innerText = "❌ GPS Not Supported";
  }

  // Real-time updates
  db.ref(`sessions/${sessionId}`).on('value', (snapshot) => {
    const data = snapshot.val() || {};
    document.getElementById("status").innerText = `${Object.keys(data).length} people online`;

    let points = [];

    Object.keys(data).forEach(id => {
      const user = data[id];
      points.push([user.lat, user.lng]);

      if (!markers[id]) {
        markers[id] = L.marker([user.lat, user.lng]).addTo(map);
        markers[id].bindPopup(id === userId ? "<b>You</b>" : "<b>Friend</b>");

        circles[id] = L.circle([user.lat, user.lng], {
          radius: user.accuracy || 30,
          color: id === userId ? "#2563eb" : "#10b981",
          fillOpacity: 0.2
        }).addTo(map);
      } else {
        markers[id].setLatLng([user.lat, user.lng]);
        circles[id].setLatLng([user.lat, user.lng]);
        circles[id].setRadius(user.accuracy || 30);
      }
    });

    // Remove offline users
    Object.keys(markers).forEach(id => {
      if (!data[id]) {
        if (markers[id]) map.removeLayer(markers[id]);
        if (circles[id]) map.removeLayer(circles[id]);
        delete markers[id];
        delete circles[id];
      }
    });

    if (points.length === 1) map.flyTo(points[0], 16);
    else if (points.length > 1) map.flyToBounds(L.latLngBounds(points), { padding: [60, 60] });
  });
}

window.retryGPS = function() {
  if (watchId) navigator.geolocation.clearWatch(watchId);
  document.getElementById("status").innerText = "Retrying GPS...";
  startLiveSession(sessionId);
};

window.copyLink = function() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    alert("✅ Link Copied!");
  });
};

window.shareWhatsApp = function() {
  const text = encodeURIComponent(`🔴 Join Live Group Location: ${window.location.href}`);
  window.open(`https://wa.me/?text=${text}`, "_blank");
};

// Auto Join
window.addEventListener('load', () => {
  const room = getRoomFromURL();
  if (room) {
    sessionId = room;
    document.getElementById("startBtn").style.display = "none";
    document.getElementById("shareOptions").style.display = "flex";
    startLiveSession(room);
  }
});
</script>
</body>
</html>
