<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Group Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    overflow: hidden;
    background: #f8fafc;
  }

  h1 {
    background: #0f172a;
    color: white;
    padding: 14px;
    margin: 0;
    text-align: center;
    font-size: 1.3rem;
  }

  #map {
    width: 100%;
    height: calc(100vh - 56px);
  }

  .control-panel {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    padding: 15px;
    border-radius: 14px;
    box-shadow: 0 4px 25px rgba(0,0,0,0.2);
    width: 92%;
    max-width: 400px;
    text-align: center;
  }

  .btn {
    padding: 13px 20px;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    width: 100%;
    margin: 6px 0;
  }

  .btn-primary { background: #2563eb; color: white; }
  .btn-success { background: #10b981; color: white; }
  .btn-copy { background: #64748b; color: white; }

  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-row .btn { margin: 0; flex: 1; }

  #status { margin: 10px 0 5px 0; font-weight: 500; font-size: 0.95rem; }
  #online { font-size: 0.9rem; color: #10b981; margin: 5px 0; }
</style>
</head>
<body>

<h1>Live Group Tracker</h1>
<div id="map"></div>

<div class="control-panel">
  <button id="startBtn" class="btn btn-primary" onclick="startTracking()">
    Start Live Sharing
  </button>
  
  <div id="shareOptions" class="btn-row" style="display: none;">
    <button class="btn btn-success" onclick="shareWhatsApp()">📲 WhatsApp</button>
    <button class="btn btn-copy" onclick="copyLink()">📋 Copy Link</button>
  </div>

  <p id="status">Ready</p>
  <p id="online">0 people online</p>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, set, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlmbq7wB_IfKAUVgLoh6rK9F1IQPqG1Y",
  authDomain: "live-map-40eee.firebaseapp.com",
  databaseURL: "https://live-map-40eee-default-rtdb.firebaseio.com",
  projectId: "live-map-40eee",
  storageBucket: "live-map-40eee.firebasestorage.app",
  messagingSenderId: "886609126465",
  appId: "1:886609126465:web:099c5d8524803ae4be12c0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let map, watchId = null, sessionId = null, myRef = null;
const userId = localStorage.getItem("tracker_userId") || crypto.randomUUID();
localStorage.setItem("tracker_userId", userId);

map = L.map('map', { zoomControl: false }).setView([30.3753, 69.3451], 5);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let markers = {};
let circles = {};
let lastBoundsUpdate = 0;

function getRoomFromURL() {
  return new URLSearchParams(window.location.search).get("room");
}

window.startTracking = function() {
  if (!sessionId) {
    sessionId = Math.floor(100000 + Math.random() * 900000).toString();
    history.replaceState({}, '', `?room=${sessionId}`);
  }

  document.getElementById("startBtn").style.display = "none";
  document.getElementById("shareOptions").style.display = "flex";
  document.getElementById("status").innerText = `Room: ${sessionId}`;

  startLiveSession(sessionId);
};

function startLiveSession(sid) {
  sessionId = sid;
  myRef = ref(db, `sessions/${sessionId}/${userId}`);

  // Auto remove jab user page band kare
  onDisconnect(myRef).remove();

  // GPS Tracking
  if (navigator.geolocation) {
    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude: lat, longitude: lng, accuracy } = pos.coords;
        document.getElementById("status").innerText = `✅ Live Tracking Active`;

        set(myRef, {
          lat,
          lng,
          accuracy,
          time: Date.now()
        });
      },
      (err) => console.error("GPS Error:", err),
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
    );
  }

  // Real-time Data + Cleanup Logic
  onValue(ref(db, `sessions/${sessionId}`), (snapshot) => {
    const data = snapshot.val() || {};
    const userCount = Object.keys(data).length;
    
    document.getElementById("online").innerText = `${userCount} people online`;

    let points = [];

    // Update / Add markers
    Object.keys(data).forEach(id => {
      const user = data[id];
      points.push([user.lat, user.lng]);

      const isMe = id === userId;

      if (!markers[id]) {
        markers[id] = L.marker([user.lat, user.lng]).addTo(map);
        markers[id].bindPopup(isMe ? "<b>You</b>" : "<b>Friend</b>");

        circles[id] = L.circle([user.lat, user.lng], {
          radius: user.accuracy || 30,
          color: isMe ? '#2563eb' : '#10b981',
          fillOpacity: 0.18
        }).addTo(map);
      } else {
        markers[id].setLatLng([user.lat, user.lng]);
        circles[id].setLatLng([user.lat, user.lng]);
        circles[id].setRadius(user.accuracy || 30);
      }
    });

    // Remove users who left
    Object.keys(markers).forEach(id => {
      if (!data[id]) {
        if (markers[id]) map.removeLayer(markers[id]);
        if (circles[id]) map.removeLayer(circles[id]);
        delete markers[id];
        delete circles[id];
      }
    });

    // Smart Auto Zoom
    if (points.length > 0 && Date.now() - lastBoundsUpdate > 2500) {
      lastBoundsUpdate = Date.now();
      if (points.length === 1) {
        map.flyTo(points[0], 16, { duration: 1.2 });
      } else {
        map.flyToBounds(L.latLngBounds(points), {
          padding: [70, 70],
          maxZoom: 17,
          duration: 1.3
        });
      }
    }
  });
};

// Share Functions
window.copyLink = function() {
  const link = `${window.location.origin}${window.location.pathname}?room=${sessionId}`;
  navigator.clipboard.writeText(link).then(() => {
    const btn = document.querySelector('.btn-copy');
    const oldText = btn.textContent;
    btn.textContent = '✅ Copied!';
    setTimeout(() => btn.textContent = oldText, 2000);
  });
};

window.shareWhatsApp = function() {
  const link = `${window.location.origin}${window.location.pathname}?room=${sessionId}`;
  const msg = encodeURIComponent(`🔴 Group Live Location\nSab join ho jao: ${link}`);
  window.open(`https://wa.me/?text=${msg}`, '_blank');
};

// Auto Join from Link
window.addEventListener('load', () => {
  const room = getRoomFromURL();
  if (room) {
    sessionId = room;
    document.getElementById("startBtn").style.display = "none";
    document.getElementById("shareOptions").style.display = "flex";
    startLiveSession(room);
  }
});
</script>
</body>
</html>
